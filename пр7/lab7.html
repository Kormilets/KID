<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новорічна листівка 2027 — Лабораторна робота №7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">

  <!-- Фоновий снігопад -->
  <div class="snowfall page__snowfall" aria-hidden="true">
    <span class="snowfall__flake snowfall__flake--size-sm"></span>
    <span class="snowfall__flake snowfall__flake--size-md"></span>
    <span class="snowfall__flake snowfall__flake--size-lg"></span>
    <span class="snowfall__flake snowfall__flake--size-sm"></span>
    <span class="snowfall__flake snowfall__flake--size-md"></span>
    <span class="snowfall__flake snowfall__flake--size-lg"></span>
    <span class="snowfall__flake snowfall__flake--size-sm"></span>
    <span class="snowfall__flake snowfall__flake--size-md"></span>
    <span class="snowfall__flake snowfall__flake--size-lg"></span>
    <span class="snowfall__flake snowfall__flake--size-sm"></span>
  </div>

  <!-- Основний блок листівки -->
  <main class="card page__card">
    
    <!-- Верхня гірлянда -->
    <ul class="garland card__garland" aria-hidden="true">
      <li class="garland__bulb garland__bulb--color-red"></li>
      <li class="garland__bulb garland__bulb--color-gold"></li>
      <li class="garland__bulb garland__bulb--color-green"></li>
      <li class="garland__bulb garland__bulb--color-blue"></li>
      <li class="garland__bulb garland__bulb--color-red"></li>
      <li class="garland__bulb garland__bulb--color-gold"></li>
      <li class="garland__bulb garland__bulb--color-green"></li>
      <li class="garland__bulb garland__bulb--color-blue"></li>
    </ul>

    <!-- Декоративна ялинка -->
    <div class="tree card__tree" aria-hidden="true">
      <div class="tree__star">★</div>
      <div class="tree__tier tree__tier--level-top"></div>
      <div class="tree__tier tree__tier--level-middle"></div>
      <div class="tree__tier tree__tier--level-bottom"></div>
      <div class="tree__trunk"></div>
    </div>

    <!-- Текстова частина листівки -->
    <div class="card__content">
      <span class="card__year">2027</span>
      <h1 class="card__title">З Новим Роком та Різдвом!</h1>
      <p class="card__message">
        Нехай новий рік принесе затишок у дім, натхнення для сміливих ідей, 
        теплі зустрічі з близькими та здійснення найзаповітніших мрій!
      </p>
      <div class="card__footer">
        <span class="card__signature">З найкращими побажаннями ✨</span>
      </div>
    </div>

  </main>

</body>
</html>
